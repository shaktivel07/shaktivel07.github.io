<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadline Calendar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e5e7eb;--ac:#4f46e5;
--tds:#3b82f6;--sct:#f59e0b;--mlp:#10b981;--asg:#8b5cf6;--my:#ec4899}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--tx:#e8eaf0;--mu:#9aa0ae;--bd:#2a2e3b;--ac:#818cf8}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--tx:#e8eaf0;--mu:#9aa0ae;--bd:#2a2e3b;--ac:#818cf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:480px;margin:0 auto;padding-bottom:90px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
h1{font-size:20px;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.nav{display:flex;gap:6px;align-items:center}
.nav button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 11px}
.tabs{display:flex;margin:6px 16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px}
.tabs button{flex:1;padding:7px;border-radius:9px;color:var(--mu)}
.tabs .on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:6px 12px}
.dow{text-align:center;font-size:11px;color:var(--mu);padding:2px 0}
.day{aspect-ratio:1/1.05;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.day.out{opacity:.35}.day.today{border-color:var(--ac);font-weight:700}
.day.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%}
.leg{display:flex;flex-wrap:wrap;gap:10px;padding:2px 16px;font-size:12px;color:var(--mu)}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
h2{font-size:15px;margin:14px 16px 6px}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:12px;margin:6px 16px;padding:10px 12px}
.task .t{flex:1}.task small{color:var(--mu);display:block}
.task.done .t b{text-decoration:line-through;opacity:.5}
.task input{width:20px;height:20px;accent-color:var(--ac)}
.x{color:var(--mu);font-size:18px;padding:0 4px}
.empty{color:var(--mu);text-align:center;padding:18px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.sheet input,.sheet select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:10px}.row>div{flex:1}
.save{width:100%;margin-top:16px;background:var(--ac);color:#fff;padding:12px;border-radius:12px;font-weight:600}
.up-h{font-size:12px;color:var(--mu);margin:14px 16px 0;text-transform:uppercase;letter-spacing:.04em}
</style></head><body>
<header><h1 id="ttl">📅 Deadlines</h1><div class="nav"><button id="prev">‹</button><button id="today">Today</button><button id="next">›</button></div></header>
<div class="tabs"><button id="tCal" class="on">Calendar</button><button id="tUp">Upcoming</button></div>
<div id="calV"><div class="grid" id="grid"></div>
<div class="leg"><span><i style="background:var(--tds)"></i>TDS</span><span><i style="background:var(--sct)"></i>SCT</span><span><i style="background:var(--mlp)"></i>MLP/MAD</span><span><i style="background:var(--asg)"></i>Assignments</span><span><i style="background:var(--my)"></i>Mine</span></div>
<h2 id="selH"></h2><div id="list"></div></div>
<div id="upV" style="display:none"></div>
<button class="fab" id="fab" aria-label="Add task">+</button>
<div class="ov" id="ov"><div class="sheet">
<b style="font-size:17px">New task</b>
<label>Title</label><input id="fT" placeholder="e.g. Revise GA3">
<div class="row"><div><label>Date</label><input type="date" id="fS"></div><div><label>End date (optional)</label><input type="date" id="fE"></div></div>
<label>Category</label><select id="fC"><option value="my">Mine</option><option value="tds">TDS</option><option value="sct">SCT</option><option value="mlp">MLP / MAD</option><option value="asg">Assignment</option></select>
<button class="save" id="save">Add task</button></div></div>
<script>
const $=id=>document.getElementById(id);
const iso=(m,d,y=2026)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const seed=()=>{const L=[],a=(t,s,c,e)=>L.push({id:'s'+L.length,t,s,e:e||s,c,done:false});
// TDS
[["Bootcamp GA0",10,11],["Week-1 GA1",10,11],["Week-2 GA2",10,18],["Project 1 (P1 · 20%)",11,9],["Week-3 GA3",10,25],["Week-4 GA4",11,8],["Week-5 GA5",11,18],["Project 2 (P2 · 20%)",12,13],["Week-6 GA6",11,23],["Week-7 GA7",11,30],["Week-8 GA8",12,7]].forEach(x=>a('TDS: '+x[0]+' due',iso(x[1],x[2]),'tds'));
a('TDS: Remote Online Exam (1:00 PM)',iso(11,29),'tds');
a('TDS: Final end-term (in-person)',iso(1,10,2027),'tds');
a('SCT Test – Window 2',iso(10,12),'sct',iso(10,15));
// MLP
a('MLP: OPPE1',iso(11,22),'mlp');a('MLP: OPPE2',iso(12,20),'mlp');
[[1,11,13],[2,25,27]].forEach(([n,d,p])=>{a(`MLP: KA ${n} deadline`,iso(11,d),'mlp');a(`MLP: KA ${n} peer review`,iso(11,p),'mlp')});
a('MLP: KA 3 deadline',iso(12,14),'mlp');a('MLP: KA 3 peer review',iso(12,16),'mlp');
a('MLP Project deadline',iso(11,17),'mlp');a('MAD 2 Project deadline',iso(11,17),'mlp');
// Assignments
[[10,11],[10,18],[10,25],[11,1],[11,11],[11,18],[11,25],[11,29],[12,6],[12,13],[12,23]].forEach((x,i)=>a(`Assignment Week ${i+1}`,iso(x[0],x[1]),'asg'));
return L};
const K='deadline-cal-v1';let tasks;
try{tasks=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!Array.isArray(tasks))tasks=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(tasks))}catch(e){}};
const tod=new Date();const T=iso(tod.getMonth()+1,tod.getDate(),tod.getFullYear());
let vy=tod.getFullYear(),vm=tod.getMonth(),sel=T;
const col=c=>`var(--${c})`;
const on=(t,d)=>t.s<=d&&d<=t.e;
const fmt=s=>new Date(s+'T00:00').toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function taskEl(t,showDate){const e=document.createElement('div');e.className='task'+(t.done?' done':'');e.style.setProperty('--c',col(t.c));
e.innerHTML=`<input type="checkbox" ${t.done?'checked':''}><div class="t"><b></b><small>${showDate?fmt(t.s)+(t.e!==t.s?' → '+fmt(t.e):''):(t.e!==t.s?fmt(t.s)+' → '+fmt(t.e):'')}</small></div><button class="x">✕</button>`;
e.querySelector('b').textContent=t.t;
e.querySelector('input').onchange=ev=>{t.done=ev.target.checked;save();render()};
e.querySelector('.x').onclick=()=>{if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==t.id);save();render()}};return e}
function render(){
$('ttl').textContent=new Date(vy,vm,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
const g=$('grid');g.innerHTML='';'SMTWTFS'.split('').forEach(d=>g.insertAdjacentHTML('beforeend',`<div class="dow">${d}</div>`));
const first=new Date(vy,vm,1).getDay(),dim=new Date(vy,vm+1,0).getDate();
for(let i=0;i<first;i++)g.insertAdjacentHTML('beforeend','<div></div>');
for(let d=1;d<=dim;d++){const s=iso(vm+1,d,vy);const cs=[...new Set(tasks.filter(t=>on(t,s)&&!t.done).map(t=>t.c))];
const b=document.createElement('button');b.className='day'+(s===T?' today':'')+(s===sel?' sel':'');
b.innerHTML=`${d}<div class="dots">${cs.map(c=>`<span class="dot" style="background:${col(c)}"></span>`).join('')}</div>`;
b.onclick=()=>{sel=s;render()};g.appendChild(b)}
$('selH').textContent=fmt(sel);const l=$('list');l.innerHTML='';
const ts=tasks.filter(t=>on(t,sel));
if(!ts.length)l.innerHTML='<div class="empty">No tasks this day</div>';ts.forEach(t=>l.appendChild(taskEl(t)));
// upcoming
const u=$('upV');u.innerHTML='';const up=tasks.filter(t=>t.e>=T&&!t.done).sort((a,b)=>a.s.localeCompare(b.s));
if(!up.length)u.innerHTML='<div class="empty">Nothing upcoming 🎉</div>';
let last='';up.forEach(t=>{const k=t.s<T?T:t.s;if(k!==last){const dd=Math.round((new Date(k)-new Date(T))/864e5);u.insertAdjacentHTML('beforeend',`<div class="up-h">${fmt(k)} · ${dd===0?'today':dd+' day'+(dd>1?'s':'')+' left'}</div>`);last=k}u.appendChild(taskEl(t))})}
function mv(n){vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}render()}
$('prev').onclick=()=>mv(-1);$('next').onclick=()=>mv(1);
$('today').onclick=()=>{vy=tod.getFullYear();vm=tod.getMonth();sel=T;render()};
function tab(c){$('calV').style.display=c?'':'none';$('upV').style.display=c?'none':'';$('tCal').className=c?'on':'';$('tUp').className=c?'':'on'}
$('tCal').onclick=()=>tab(1);$('tUp').onclick=()=>tab(0);
$('fab').onclick=()=>{$('fT').value='';$('fS').value=sel;$('fE').value='';$('ov').classList.add('show');$('fT').focus()};
$('ov').onclick=e=>{if(e.target===$('ov'))$('ov').classList.remove('show')};
$('save').onclick=()=>{const t=$('fT').value.trim(),s=$('fS').value;if(!t||!s){alert('Add a title and date');return}
let e=$('fE').value;if(!e||e<s)e=s;tasks.push({id:'u'+Date.now(),t,s,e,c:$('fC').value,done:false});save();
$('ov').classList.remove('show');sel=s;vy=+s.slice(0,4);vm=+s.slice(5,7)-1;render()};
render();
</script></body></html>
